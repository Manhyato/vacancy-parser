<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vacancy Parser</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Парсер вакансий</h1>
        <p>Нажмите кнопку, чтобы запустить сбор данных.</p>

        <button id="updateBtn">🔄 Обновить вакансии</button>

        <h2>📋 Список вакансий</h2>
        <table id="vacancyTable">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Компания</th>
                    <th>Город</th>
                    <th>Зарплата</th>
                    <th>Источник</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const updateBtn = document.getElementById("updateBtn");
        const tbody = document.querySelector("#vacancyTable tbody");

        updateBtn.addEventListener("click", async () => {
            updateBtn.disabled = true;
            updateBtn.textContent = "Парсинг...";
            await fetch("/api/vacancies/parse", { method: "POST" });
            await loadVacancies();
            updateBtn.disabled = false;
            updateBtn.textContent = "Обновить вакансии";
        });

        async function loadVacancies() {
            const res = await fetch("/api/vacancies/results");
            const data = await res.json();
            tbody.innerHTML = data.map(v => `
                <tr>
                    <td>${v.title}</td>
                    <td>${v.company}</td>
                    <td>${v.city}</td>
                    <td>${v.salary}</td>
                    <td>${v.source}</td>
                </tr>
            `).join("");
        }

        loadVacancies();
    </script>
</body>
</html>
